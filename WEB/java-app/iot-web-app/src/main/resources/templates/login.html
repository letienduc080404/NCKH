<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>IOT_SENTRY | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-input: #f8f9fa;
            --border-light: #e2e8f0;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --color-ptit: #b31d1d;
        }
        body { background: var(--bg-body); color: var(--text-main); font-family: 'Inter', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .glass { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 24px; box-shadow: var(--card-shadow); padding: 48px; width: 100%; max-width: 420px; position: relative; overflow: hidden; }
        .input-field { width: 100%; padding: 14px 16px; border: 1px solid var(--border-light); border-radius: 12px; background: var(--bg-input); font-size: 14px; font-weight: 500; color: var(--text-main); transition: all 0.2s; outline: none; }
        .input-field:focus { border-color: var(--color-ptit); background: #fff; box-shadow: 0 0 0 3px rgba(179, 29, 29, 0.1); }
        .btn-primary { width: 100%; padding: 14px; background: var(--color-ptit); color: #fff; font-size: 14px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em; }
        .btn-primary:hover { background: #941717; transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        .ms { font-family: 'Material Symbols Outlined'; font-size: 20px; font-weight: 400; font-style: normal; line-height: 1; vertical-align: middle; }
    </style>
</head>
<body>

<div class="glass">
    <!-- Decorative background elements -->
    <div style="position:absolute;top:-50px;right:-50px;width:200px;height:200px;background:radial-gradient(circle,rgba(179,29,29,.08),transparent 70%);border-radius:50%;"></div>
    
    <div class="text-center mb-8 relative z-10">
        <div style="width:64px;height:64px;margin:0 auto 16px;display:flex;justify-content:center;align-items:center;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/13/Logo_PTIT_University.png" alt="PTIT Logo" style="width:100%;height:100%;object-fit:contain;"/>
        </div>
        <h1 style="font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1.2;">IOT_SENTRY</h1>
        <p style="font-size:12px;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;">Secure Access Portal</p>
    </div>

    <div th:if="${param.error}" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#ef4444;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:8px;">
        <span class="ms">error</span> Sai tên đăng nhập hoặc mật khẩu.
    </div>
    
    <div th:if="${param.logout}" style="background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);color:#10b981;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:8px;">
        <span class="ms">check_circle</span> Bạn đã đăng xuất thành công.
    </div>

    <form th:action="@{/login}" method="post" class="relative z-10 flex flex-col gap-5">
        <div>
            <label for="username" style="display:block;font-size:12px;font-weight:700;color:var(--text-main);margin-bottom:6px;">Tên đăng nhập</label>
            <div class="relative">
                <input type="text" id="username" name="username" class="input-field" placeholder="Nhập tài khoản..." required autofocus>
            </div>
        </div>
        
        <div>
            <label for="password" style="display:block;font-size:12px;font-weight:700;color:var(--text-main);margin-bottom:6px;">Mật khẩu</label>
            <div class="relative">
                <input type="password" id="password" name="password" class="input-field" placeholder="••••••••" required>
            </div>
        </div>
        
        <button type="submit" class="btn-primary mt-2">
            Đăng nhập <span class="ms" style="font-size:16px;margin-left:4px;">login</span>
        </button>
    </form>
    
    <div class="mt-8 text-center relative z-10" style="font-size:11px;color:var(--text-muted);">
        &copy; 2026 PTIT - IoT System Control.<br>All rights reserved.
    </div>
</div>

</body>
</html>

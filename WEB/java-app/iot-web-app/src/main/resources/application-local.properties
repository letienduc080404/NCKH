# 1. Port
server.port=8080

# 2. Ket noi H2 (In-memory) de test giao dien khong can Docker
spring.datasource.url=jdbc:h2:mem:iot_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 3. Hibernate cau hinh
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Cho phep truy cap H2 Console (tuy chon) thong qua /h2-console
spring.h2.console.enabled=true

# Tat cache Thymeleaf
spring.thymeleaf.cache=false

# 5. Cau hinh MQTT Broker
# Doi voi local test voi Mosquitto: mqtt.broker.url=tcp://localhost:1883
# Doi voi HiveMQ Cloud (giong ESP32): dung ssl:// va port 8883
mqtt.broker.url=tcp://localhost:1883
mqtt.topic.sensor=iot/sensor/data/+
mqtt.topic.command=iot/device/control/+
# Them credentials neu broker yeu cau xac thuc (HiveMQ Cloud)
# mqtt.username=your_hivemq_user
# mqtt.password=your_hivemq_password
